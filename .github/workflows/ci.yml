name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # Not bare `tsc`: PageProps and LayoutProps are global types Next
      # generates into .next/types, which a fresh checkout does not have.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
